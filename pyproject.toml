[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hindsight-grpo"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0", "transformers==4.57.1", "accelerate==1.11.0",
  "peft==0.17.1", "datasets==4.2.0", "huggingface-hub==0.36.0",
  "numpy==2.2.6", "wandb==0.22.3", "matplotlib==3.10.7",
  "sentencepiece==0.2.0", "omegaconf==2.3.0", "rich==14.2.0",
  "tyro==0.9.35", "torchmetrics==1.8.2", "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
environments = ["sys_platform == 'linux' or sys_platform == 'darwin'"]
